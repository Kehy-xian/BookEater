name: windows-installer-smoke
on:
  workflow_dispatch:
  push:
    branches: [sprint-04-play-loop]
    paths:
      - '.github/workflows/windows-installer-smoke.yml'
      - 'installer/**'
      - 'bookeater_desktop.py'
      - 'BookEater.spec'
      - 'requirements-build.txt'
      - 'requirements-local-nlp.txt'
      - 'tools/fetch_e5_model.py'
      - 'tools/expand_bundled_sprites.py'
      - 'tools/generate_paperling_sprites.py'
      - 'tools/generate_route_sprites.py'
      - 'tools/generate_subroute_sprites.py'
      - 'tools/generate_extended_sprites.py'
      - 'tools/build_update_manifest.py'
      - 'resources/catalog_endpoint.txt'
      - 'resources/update_manifest_endpoint.txt'
      - 'resources/sprites/**'
      - 'resources/sprite_archives/**'
      - 'src/bookeater/**'

jobs:
  installer-smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Expand production sprites
        run: python tools/expand_bundled_sprites.py
      - name: Fetch bundled local model
        run: python tools/fetch_e5_model.py
      - name: Build desktop folder
        run: pyinstaller --noconfirm --clean BookEater.spec
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe missing after Inno Setup install' }
          & $iscc 'installer\BookEater.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile exit=$LASTEXITCODE" }
          if (-not (Test-Path 'dist\installer\BookEater-Setup.exe')) { throw 'BookEater-Setup.exe missing' }
      - name: Build and verify update manifest contract
        shell: pwsh
        run: |
          python tools/build_update_manifest.py `
            --installer 'dist\installer\BookEater-Setup.exe' `
            --url 'https://downloads.example.com/BookEater-Setup.exe' `
            --output 'dist\installer\latest.smoke.json' `
            --notes 'CI manifest contract check'
          $manifest = Get-Content 'dist\installer\latest.smoke.json' -Raw | ConvertFrom-Json
          $hash = (Get-FileHash 'dist\installer\BookEater-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          if ($manifest.sha256 -ne $hash) { throw 'manifest SHA256 does not match installer bytes' }
          if ($manifest.installer_url -notmatch '^https://') { throw 'manifest installer URL is not HTTPS' }
      - name: Install, upgrade in place, uninstall, preserve user data
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist\installer\BookEater-Setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'BookEaterInstalled'
          $dataDir = Join-Path $env:RUNNER_TEMP 'BookEaterPersistentData'
          $env:BOOKEATER_DATA_DIR = $dataDir

          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exit=$($install.ExitCode)" }

          $exe = Join-Path $installDir 'BookEater.exe'
          if (-not (Test-Path $exe)) { throw 'installed BookEater.exe missing' }
          $smoke = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "installed smoke exit=$($smoke.ExitCode)" }

          $db = Join-Path $dataDir 'bookeater.sqlite3'
          if (-not (Test-Path $db)) { throw 'installed app did not create persistent database' }
          $versionMarker = Join-Path $dataDir 'last_successful_app_version.txt'
          if (-not (Test-Path $versionMarker)) { throw 'installed app did not create app-version marker' }
          $expectedVersion = python -c "import sys; sys.path.insert(0, 'src'); from bookeater.version import APP_VERSION; print(APP_VERSION)"
          if ((Get-Content $versionMarker -Raw).Trim() -ne $expectedVersion) { throw 'fresh install wrote unexpected app-version marker' }
          $upgradeDir = Join-Path $dataDir 'backups\version-upgrades'
          if (Test-Path $upgradeDir) {
            $freshBackups = @(Get-ChildItem $upgradeDir -Filter '*.sqlite3' -File -ErrorAction SilentlyContinue)
            if ($freshBackups.Count -ne 0) { throw 'fresh install unexpectedly created a version-upgrade backup' }
          }

          # Put a known value inside the live DB, then simulate launching a newer app version by
          # making the sidecar marker older. The next packaged launch must take a SQLite backup
          # BEFORE any store/schema migration can run.
          $env:BOOKEATER_TEST_DB = $db
          @'
          import os, sqlite3
          db = os.environ['BOOKEATER_TEST_DB']
          con = sqlite3.connect(db)
          con.execute("INSERT INTO app_settings(key,value) VALUES('upgrade_guard_probe','must-survive-backup') ON CONFLICT(key) DO UPDATE SET value=excluded.value")
          con.commit(); con.close()
          '@ | python -
          '0.0.1-old' | Set-Content -Encoding ascii $versionMarker

          # Exercise the installer upgrade path itself, not only the app's version marker logic.
          # The installer may replace application files, but it must not open, migrate, or alter
          # the user database or advance the app-version marker before the upgraded app starts.
          $dbHashBeforeInstallerUpgrade = (Get-FileHash $db -Algorithm SHA256).Hash
          $upgradeInstall = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir"
          ) -Wait -PassThru
          if ($upgradeInstall.ExitCode -ne 0) { throw "in-place installer upgrade exit=$($upgradeInstall.ExitCode)" }
          if (-not (Test-Path $exe)) { throw 'in-place installer upgrade removed BookEater.exe' }
          if ((Get-FileHash $db -Algorithm SHA256).Hash -ne $dbHashBeforeInstallerUpgrade) { throw 'installer upgrade modified the user database before app launch' }
          if ((Get-Content $versionMarker -Raw).Trim() -ne '0.0.1-old') { throw 'installer upgrade advanced the app-version marker before app launch' }
          if (Test-Path $upgradeDir) {
            $preLaunchBackups = @(Get-ChildItem $upgradeDir -Filter '*.sqlite3' -File -ErrorAction SilentlyContinue)
            if ($preLaunchBackups.Count -ne 0) { throw 'installer created a version-upgrade backup instead of leaving migration safety to app startup' }
          }

          $upgradeSmoke = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($upgradeSmoke.ExitCode -ne 0) { throw "version-transition smoke exit=$($upgradeSmoke.ExitCode)" }
          if ((Get-Content $versionMarker -Raw).Trim() -ne $expectedVersion) { throw 'upgraded app did not advance the app-version marker after successful startup' }

          $upgradeBackups = @(Get-ChildItem $upgradeDir -Filter '*.sqlite3' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime)
          if ($upgradeBackups.Count -ne 1) { throw "version transition created $($upgradeBackups.Count) backups; expected exactly one" }
          $upgradeBackup = $upgradeBackups[-1]
          $env:BOOKEATER_TEST_BACKUP = $upgradeBackup.FullName
          @'
          import os, sqlite3
          for label, path in (
              ('live database', os.environ['BOOKEATER_TEST_DB']),
              ('pre-version backup', os.environ['BOOKEATER_TEST_BACKUP']),
          ):
              con = sqlite3.connect(path)
              check = con.execute('PRAGMA quick_check').fetchone()[0]
              value = con.execute("SELECT value FROM app_settings WHERE key='upgrade_guard_probe'").fetchone()
              con.close()
              if str(check).lower() != 'ok':
                  raise SystemExit(f'{label} quick_check failed')
              if value != ('must-survive-backup',):
                  raise SystemExit(f'{label} lost probe data')
          '@ | python -

          # A successful same-version restart must be idempotent and must not create another
          # automatic backup once the version marker has advanced.
          $sameVersionSmoke = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($sameVersionSmoke.ExitCode -ne 0) { throw "same-version smoke exit=$($sameVersionSmoke.ExitCode)" }
          $sameVersionBackups = @(Get-ChildItem $upgradeDir -Filter '*.sqlite3' -File -ErrorAction SilentlyContinue)
          if ($sameVersionBackups.Count -ne 1) { throw 'same-version restart created a redundant version-upgrade backup' }

          $marker = Join-Path $dataDir 'installer-preserve-test.txt'
          'must-survive-uninstall' | Set-Content -Encoding utf8 $marker

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exit=$($uninstall.ExitCode)" }

          if (-not (Test-Path $db)) { throw 'uninstall deleted user database' }
          if (-not (Test-Path $marker)) { throw 'uninstall deleted user data directory' }
          if (-not (Test-Path $upgradeBackup.FullName)) { throw 'uninstall deleted version-upgrade backup' }
          Write-Host 'INSTALLER_IN_PLACE_VERSION_UPGRADE_AND_USER_DATA_PRESERVATION_OK'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BookEater-windows-installer
          path: dist/installer/BookEater-Setup.exe
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
