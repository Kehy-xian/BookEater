name: windows-release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-v*'

permissions:
  contents: write

concurrency:
  group: bookeater-release-channel
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Resolve and verify release tag
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from bookeater.version import APP_VERSION; print(APP_VERSION)"
          $expected = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_REF_NAME -like 'release-v*') {
            $tag = $env:GITHUB_REF_NAME.Substring(8)
          } else {
            throw "unsupported release ref $env:GITHUB_REF"
          }
          if ($tag -ne $expected) { throw "release ref $tag does not match application version $expected" }

          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $sourceSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/sprint-04-play-loop" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0) { throw 'release source branch could not be resolved' }
            if ($env:GITHUB_SHA -ne $sourceSha) {
              throw "release trigger commit $env:GITHUB_SHA is not current source head $sourceSha"
            }
          }

          $tagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'release tag refs could not be resolved' }
          $tagMatch = @(
            $tagJson | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/$tag" }
          )
          if ($tagMatch.Count -gt 0 -and $tagMatch[0].object.sha -ne $env:GITHUB_SHA) {
            throw "existing tag $tag points to $($tagMatch[0].object.sha), not release commit $env:GITHUB_SHA"
          }
          "BOOKEATER_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Expand and validate production sprites
        shell: pwsh
        run: |
          python tools/expand_bundled_sprites.py
          $slugs = @('paperling','pagedge','inknest','lantern','route_a1','route_a2','route_b1','route_b2','route_c1','route_c2')
          foreach ($slug in $slugs) {
            python tools/validate_sprite_pack.py resources/sprites $slug --states idle,eat,walk,read,sleep,talk,spit_memory
            if ($LASTEXITCODE -ne 0) { throw "sprite validation failed: $slug" }
          }
      - name: Fetch bundled local model
        run: python tools/fetch_e5_model.py
      - name: Build Windows desktop folder
        run: pyinstaller --noconfirm --clean BookEater.spec
      - name: Run packaged smoke checks
        shell: pwsh
        run: |
          $env:BOOKEATER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bookeater-release-smoke-data'
          $smoke = Start-Process -FilePath 'dist\BookEater\BookEater.exe' -ArgumentList '--smoke' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "packaged smoke exit=$($smoke.ExitCode)" }
          $mutex = Start-Process -FilePath 'dist\BookEater\BookEater.exe' -ArgumentList '--mutex-smoke' -Wait -PassThru
          if ($mutex.ExitCode -ne 0) { throw "mutex smoke exit=$($mutex.ExitCode)" }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe missing after Inno Setup install' }
          & $iscc 'installer\BookEater.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile exit=$LASTEXITCODE" }
      - name: Build release manifest
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from bookeater.version import APP_VERSION; print(APP_VERSION)"
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:BOOKEATER_RELEASE_TAG/BookEater-Setup.exe"
          python tools/build_update_manifest.py `
            --installer 'dist\installer\BookEater-Setup.exe' `
            --url $assetUrl `
            --output 'dist\installer\release-manifest.json' `
            --notes "책먹는 몬스터 $version"
          $manifest = Get-Content 'dist\installer\release-manifest.json' -Raw | ConvertFrom-Json
          $actual = (Get-FileHash 'dist\installer\BookEater-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          if ($manifest.latest_version -ne $version) { throw 'release manifest version mismatch' }
          if ($manifest.sha256 -ne $actual) { throw 'release manifest installer hash mismatch' }
      - name: Publish immutable GitHub Release assets
        shell: pwsh
        run: |
          $prerelease = $env:BOOKEATER_RELEASE_TAG -match '-'
          gh release view $env:BOOKEATER_RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'release already exists; published version assets are immutable'
          }
          $releaseArgs = @(
            'release','create',$env:BOOKEATER_RELEASE_TAG,
            'dist\installer\BookEater-Setup.exe',
            'dist\installer\release-manifest.json',
            '--title',"책먹는 몬스터 $env:BOOKEATER_RELEASE_TAG"
          )
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $releaseArgs += @('--target', $env:GITHUB_SHA)
          }
          $version = $env:BOOKEATER_RELEASE_TAG.TrimStart('v')
          $notesPath = "docs/releases/$version.md"
          if (Test-Path $notesPath) {
            $releaseArgs += @('--notes-file', $notesPath)
          } else {
            $releaseArgs += '--generate-notes'
          }
          if ($prerelease) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publish exit=$LASTEXITCODE" }
      - name: Publish fixed update-channel manifest
        shell: pwsh
        run: |
          $branch = 'release-channel'
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$branch" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f ref="refs/heads/$branch" `
              -f sha="$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'release-channel branch creation failed' }
          }

          $endpoint = "repos/$env:GITHUB_REPOSITORY/contents/release-manifest.json"
          $existingJson = gh api "$endpoint`?ref=$branch" 2>$null
          $existing = $LASTEXITCODE -eq 0
          if ($existing) {
            $existingPayload = $existingJson | ConvertFrom-Json
            $existingBytes = [Convert]::FromBase64String(($existingPayload.content -replace '\s', ''))
            $existingPath = Join-Path $env:RUNNER_TEMP 'existing-release-manifest.json'
            [IO.File]::WriteAllBytes($existingPath, $existingBytes)
            python tools/validate_update_channel.py `
              $existingPath `
              'dist\installer\release-manifest.json'
            if ($LASTEXITCODE -ne 0) { throw 'unsafe update-channel transition rejected' }
          }
          $body = @{
            message = "Publish update manifest for $env:BOOKEATER_RELEASE_TAG"
            content = [Convert]::ToBase64String(
              [IO.File]::ReadAllBytes('dist\installer\release-manifest.json')
            )
            branch = $branch
          }
          if ($existing) {
            $body.sha = ($existingJson | ConvertFrom-Json).sha
          }
          $body | ConvertTo-Json | gh api --method PUT $endpoint --input -
          if ($LASTEXITCODE -ne 0) { throw 'update-channel manifest publish failed' }
      - name: Verify public update channel
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from bookeater.version import APP_VERSION; print(APP_VERSION)"
          $expected = Get-Content 'dist\installer\release-manifest.json' -Raw | ConvertFrom-Json
          $channel = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/release-channel/release-manifest.json"
          $published = $null
          foreach ($attempt in 1..8) {
            try {
              $published = Invoke-RestMethod -Uri "$channel`?run=$env:GITHUB_RUN_ID-$attempt"
            } catch {
              $published = $null
            }
            if ($published -and $published.latest_version -eq $version) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $published) { throw 'public update-channel manifest is unavailable' }
          if ($published.latest_version -ne $expected.latest_version) { throw 'published version mismatch' }
          if ($published.installer_url -ne $expected.installer_url) { throw 'published installer URL mismatch' }
          if ($published.sha256 -ne $expected.sha256) { throw 'published installer hash mismatch' }
      - name: Upload release verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookEater-release-${{ github.ref_name }}
          path: |
            dist/installer/BookEater-Setup.exe
            dist/installer/release-manifest.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
