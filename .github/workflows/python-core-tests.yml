# Full core regression; intentionally re-run after packaged Windows mutex validation.
name: python-core-tests
on:
  workflow_dispatch:
  push:
    branches: [sprint-03-hybrid-nlp, sprint-04-play-loop]
    paths:
      - 'src/bookeater/game/**'
      - 'src/bookeater/storage/**'
      - 'src/bookeater/services/**'
      - 'src/bookeater/version.py'
      - 'src/bookeater/runtime.py'
      - 'src/bookeater/desktop.py'
      - 'src/bookeater/launch_guard.py'
      - 'src/bookeater/pet_window.py'
      - 'src/bookeater/pet_window_v2.py'
      - 'src/bookeater/pet_window_v3.py'
      - 'src/bookeater/pet_window_v4.py'
      - 'src/bookeater/pet_window_v5.py'
      - 'src/bookeater/pet_window_v6.py'
      - 'src/bookeater/pet_window_v7.py'
      - 'src/bookeater/pet_window_v8.py'
      - 'src/bookeater/pet_window_v9.py'
      - 'src/bookeater/pet_window_v10.py'
      - 'src/bookeater/pet_window_v11.py'
      - 'src/bookeater/pet_art.py'
      - 'src/bookeater/pet_sprite.py'
      - 'src/bookeater/pet_fallback_forms.py'
      - 'src/bookeater/sprite_validation.py'
      - 'src/bookeater/art_override_store.py'
      - 'src/bookeater/pet_behavior.py'
      - 'src/bookeater/__main__.py'
      - 'bookeater_desktop.py'
      - 'installer/**'
      - 'resources/update_manifest_endpoint.txt'
      - 'server/**'
      - 'tools/build_update_manifest.py'
      - 'tools/validate_sprite_pack.py'
      - 'tools/install_sprite_override.py'
      - 'tools/generate_paperling_sprites.py'
      - 'tools/generate_route_sprites.py'
      - 'tools/generate_subroute_sprites.py'
      - 'tools/generate_extended_sprites.py'
      - 'tools/expand_bundled_sprites.py'
      - 'tests/test_layered_evolution.py'
      - 'tests/test_growth_routes.py'
      - 'tests/test_growth_route_resolver.py'
      - 'tests/test_growth_route_reachability.py'
      - 'tests/test_growth_route_persistence.py'
      - 'tests/test_route_presentation_and_recent.py'
      - 'tests/test_form_catalog.py'
      - 'tests/test_memory_service.py'
      - 'tests/test_dialogue_service.py'
      - 'tests/test_recommendation_ranker.py'
      - 'tests/test_catalog_provider.py'
      - 'tests/test_catalog_proxy.py'
      - 'tests/test_catalog_roundtrip.py'
      - 'tests/test_update_check.py'
      - 'tests/test_update_manifest_builder.py'
      - 'tests/test_version_backup.py'
      - 'tests/test_single_instance.py'
      - 'tests/test_launch_guard.py'
      - 'tests/test_app_settings.py'
      - 'tests/test_care_store.py'
      - 'tests/test_data_transfer.py'
      - 'tests/test_profile_transfer_safety.py'
      - 'tests/test_reading_draft.py'
      - 'tests/test_growth_presentation.py'
      - 'tests/test_growth_noise_robustness.py'
      - 'tests/test_growth_nutrition.py'
      - 'tests/test_growth_nutrition_v14.py'
      - 'tests/test_growth_nutrition_v15.py'
      - 'tests/test_growth_nutrition_v16.py'
      - 'tests/test_play_loop.py'
      - 'tests/test_runtime.py'
      - 'tests/test_desktop_public_contract.py'
      - 'tests/test_reading_journal.py'
      - 'tests/test_monster_milestones.py'
      - 'tests/test_monster_encyclopedia.py'
      - 'tests/test_pet_art_contract.py'
      - 'tests/test_pet_sprite_contract.py'
      - 'tests/test_pet_fallback_forms.py'
      - 'tests/test_pet_route_fallback_render.py'
      - 'tests/test_sprite_validation.py'
      - 'tests/test_art_override_store.py'
      - 'tests/test_generated_paperling_sprites.py'
      - 'tests/test_generated_route_sprites.py'
      - 'tests/test_generated_subroute_sprites.py'
      - 'tests/test_generated_extended_sprites.py'
      - 'tests/test_pet_behavior.py'
      - '.github/workflows/python-core-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest Pillow
      - run: pytest -q tests/test_layered_evolution.py tests/test_growth_routes.py tests/test_growth_route_resolver.py tests/test_growth_route_reachability.py tests/test_growth_route_persistence.py tests/test_route_presentation_and_recent.py tests/test_form_catalog.py tests/test_memory_service.py tests/test_dialogue_service.py tests/test_recommendation_ranker.py tests/test_catalog_provider.py tests/test_catalog_proxy.py tests/test_catalog_roundtrip.py tests/test_update_check.py tests/test_update_manifest_builder.py tests/test_version_backup.py tests/test_single_instance.py tests/test_launch_guard.py tests/test_app_settings.py tests/test_care_store.py tests/test_data_transfer.py tests/test_profile_transfer_safety.py tests/test_reading_draft.py tests/test_growth_presentation.py tests/test_growth_noise_robustness.py tests/test_growth_nutrition.py tests/test_growth_nutrition_v14.py tests/test_growth_nutrition_v15.py tests/test_growth_nutrition_v16.py tests/test_play_loop.py tests/test_runtime.py tests/test_desktop_public_contract.py tests/test_reading_journal.py tests/test_monster_milestones.py tests/test_monster_encyclopedia.py tests/test_pet_art_contract.py tests/test_pet_sprite_contract.py tests/test_pet_fallback_forms.py tests/test_pet_route_fallback_render.py tests/test_sprite_validation.py tests/test_art_override_store.py tests/test_generated_paperling_sprites.py tests/test_generated_route_sprites.py tests/test_generated_subroute_sprites.py tests/test_generated_extended_sprites.py tests/test_pet_behavior.py
