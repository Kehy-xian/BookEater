name: python-core-tests
on:
  workflow_dispatch:
  push:
    branches: [sprint-03-hybrid-nlp, sprint-04-play-loop]
    paths:
      - 'src/bookeater/game/**'
      - 'src/bookeater/storage/**'
      - 'src/bookeater/runtime.py'
      - 'src/bookeater/desktop.py'
      - 'src/bookeater/__main__.py'
      - 'tests/test_layered_evolution.py'
      - 'tests/test_growth_presentation.py'
      - 'tests/test_growth_noise_robustness.py'
      - 'tests/test_growth_nutrition.py'
      - 'tests/test_growth_nutrition_v14.py'
      - 'tests/test_growth_nutrition_v15.py'
      - 'tests/test_growth_nutrition_v16.py'
      - 'tests/test_play_loop.py'
      - 'tests/test_runtime.py'
      - 'tests/test_desktop_public_contract.py'
      - '.github/workflows/python-core-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: pytest -q tests/test_layered_evolution.py tests/test_growth_presentation.py tests/test_growth_noise_robustness.py tests/test_growth_nutrition.py tests/test_growth_nutrition_v14.py tests/test_growth_nutrition_v15.py tests/test_growth_nutrition_v16.py tests/test_play_loop.py tests/test_runtime.py tests/test_desktop_public_contract.py
