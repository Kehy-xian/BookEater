name: windows-e5-v3-calibration
on:
  workflow_dispatch:
  push:
    branches:
      - sprint-03-hybrid-nlp
    paths:
      - 'src/bookeater/nlp/hybrid_classifier_v3.py'
      - 'ci/e5_v3_calibration_seen.py'
      - 'tools/fetch_e5_model.py'
      - 'requirements-local-nlp.txt'
      - '.github/workflows/windows-e5-v3-calibration.yml'

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install E5 runtime
        shell: pwsh
        run: python -m pip install -r requirements-local-nlp.txt
      - name: Fetch official multilingual-e5-small ONNX assets
        shell: pwsh
        run: python tools/fetch_e5_model.py
      - name: Run seen-case calibration
        shell: pwsh
        run: python ci/e5_v3_calibration_seen.py
      - name: Print report
        shell: pwsh
        run: Get-Content -Encoding utf8 tests/e5_v3_calibration_seen.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: e5-v3-calibration-report
          path: tests/e5_v3_calibration_seen.md
