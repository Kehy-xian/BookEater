name: windows-e5-targeted
on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/e5_targeted_validation.py'
      - 'tools/fetch_e5_model.py'
      - 'requirements-local-nlp.txt'
      - '.github/workflows/windows-e5-targeted.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install E5 runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local-nlp.txt
      - name: Fetch official multilingual-e5-small ONNX assets
        shell: pwsh
        run: python tools/fetch_e5_model.py
      - name: Run NULL + metaphor + multilabel benchmark
        shell: pwsh
        run: python ci/e5_targeted_validation.py
      - name: Print report
        shell: pwsh
        run: Get-Content tests/e5_targeted_windows_report.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: e5-targeted-windows-report
          path: |
            tests/e5_targeted_windows_report.md
            tests/e5_targeted_windows_results.json
