name: catalog-server-smoke
on:
  workflow_dispatch:
  push:
    branches: [sprint-04-play-loop]
    paths:
      - 'server/**'
      - '.github/workflows/catalog-server-smoke.yml'

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build catalog proxy image
        run: docker build -f server/Dockerfile -t bookeater-catalog:test .
      - name: Start proxy container
        run: |
          docker run -d --name bookeater-catalog-smoke \
            -e KAKAO_REST_API_KEY=dummy-ci-key \
            -p 8787:8787 \
            bookeater-catalog:test
      - name: Wait for health endpoint
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/health | grep -q '"ok":true'; then
              echo 'CATALOG_DOCKER_HEALTH_OK'
              exit 0
            fi
            sleep 1
          done
          docker logs bookeater-catalog-smoke || true
          exit 1
      - name: Verify no upstream key is returned
        run: |
          body="$(curl --fail --silent http://127.0.0.1:8787/health)"
          if echo "$body" | grep -q 'dummy-ci-key'; then
            echo 'server leaked upstream key'
            exit 1
          fi
      - name: Stop container
        if: always()
        run: docker rm -f bookeater-catalog-smoke || true
