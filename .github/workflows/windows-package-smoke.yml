name: windows-package-smoke
on:
  workflow_dispatch:
  push:
    branches: [sprint-04-play-loop]
    paths:
      - '.github/workflows/windows-package-smoke.yml'
      - 'bookeater_desktop.py'
      - 'BookEater.spec'
      - 'requirements-build.txt'
      - 'requirements-local-nlp.txt'
      - 'tools/fetch_e5_model.py'
      - 'tools/expand_bundled_sprites.py'
      - 'tools/generate_paperling_sprites.py'
      - 'tools/generate_route_sprites.py'
      - 'tools/generate_subroute_sprites.py'
      - 'tools/generate_extended_sprites.py'
      - 'tools/validate_sprite_pack.py'
      - 'resources/catalog_endpoint.txt'
      - 'resources/sprites/**'
      - 'resources/sprite_archives/**'
      - 'src/bookeater/desktop.py'
      - 'src/bookeater/pet_window.py'
      - 'src/bookeater/pet_window_v2.py'
      - 'src/bookeater/pet_window_v3.py'
      - 'src/bookeater/pet_window_v4.py'
      - 'src/bookeater/pet_window_v5.py'
      - 'src/bookeater/pet_window_v6.py'
      - 'src/bookeater/pet_window_v7.py'
      - 'src/bookeater/pet_window_v8.py'
      - 'src/bookeater/pet_window_v9.py'
      - 'src/bookeater/pet_window_v10.py'
      - 'src/bookeater/pet_window_v11.py'
      - 'src/bookeater/pet_art.py'
      - 'src/bookeater/pet_sprite.py'
      - 'src/bookeater/pet_fallback_forms.py'
      - 'src/bookeater/pet_behavior.py'
      - 'src/bookeater/runtime.py'
      - 'src/bookeater/storage/**'
      - 'src/bookeater/services/**'
      - 'src/bookeater/nlp/**'
      - 'src/bookeater/game/**'
jobs:
  build-smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Expand bundled production sprites
        run: |
          python tools/expand_bundled_sprites.py
          python tools/validate_sprite_pack.py resources/sprites paperling --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites pagedge --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites inknest --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites lantern --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites route_a1 --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites route_a2 --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites route_b1 --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites route_b2 --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites route_c1 --states idle,eat,walk,read,sleep,talk,spit_memory
          python tools/validate_sprite_pack.py resources/sprites route_c2 --states idle,eat,walk,read,sleep,talk,spit_memory
      - name: Fetch bundled local model
        run: python tools/fetch_e5_model.py
      - name: Build one-folder desktop app
        run: pyinstaller --noconfirm --clean BookEater.spec
      - name: Verify packaged resources
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/BookEater/BookEater.exe')) { throw 'BookEater.exe missing' }
          $onnx = Get-ChildItem 'dist/BookEater' -Recurse -Filter model.onnx | Select-Object -First 1
          $tok = Get-ChildItem 'dist/BookEater' -Recurse -Filter tokenizer.json | Select-Object -First 1
          $catalogConfig = Get-ChildItem 'dist/BookEater' -Recurse -Filter catalog_endpoint.txt | Select-Object -First 1
          $spriteReadme = Get-ChildItem 'dist/BookEater' -Recurse -Filter README.txt | Where-Object { $_.FullName -match 'resources[\\/]sprites' } | Select-Object -First 1
          $requiredSlugs = @('paperling','pagedge','inknest','lantern','route_a1','route_a2','route_b1','route_b2','route_c1','route_c2')
          $requiredSuffixes = @('idle_00.png','eat_05.png','walk_03.png','read_02.png','sleep_02.png','talk_01.png','spit_memory_03.png')
          if (-not $onnx) { throw 'bundled model.onnx missing' }
          if (-not $tok) { throw 'bundled tokenizer.json missing' }
          if (-not $catalogConfig) { throw 'bundled catalog_endpoint.txt missing' }
          if (-not $spriteReadme) { throw 'sprite resource directory missing' }
          foreach ($slug in $requiredSlugs) {
            foreach ($suffix in $requiredSuffixes) {
              $name = "${slug}_${suffix}"
              $hit = Get-ChildItem 'dist/BookEater' -Recurse -Filter $name | Select-Object -First 1
              if (-not $hit) { throw "required production sprite missing: $name" }
            }
          }
          Write-Host "EXE bytes=$((Get-Item 'dist/BookEater/BookEater.exe').Length)"
          Write-Host "bundle MB=$([math]::Round(((Get-ChildItem 'dist/BookEater' -Recurse -File | Measure-Object Length -Sum).Sum / 1MB),1))"
      - name: Headless packaged-runtime smoke
        shell: pwsh
        run: |
          $env:BOOKEATER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bookeater-package-smoke-data'
          $proc = Start-Process -FilePath 'dist/BookEater/BookEater.exe' -ArgumentList '--smoke' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "packaged smoke exit=$($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:BOOKEATER_DATA_DIR 'bookeater.sqlite3'))) { throw 'packaged SQLite DB was not created' }
          Write-Host 'PACKAGED_WINDOWS_SMOKE_OK'
      - name: Add first-run note
        shell: pwsh
        run: |
          @"
          책먹는 몬스터 - Windows playable development build

          BookEater.exe를 실행하면 작은 투명 몬스터가 바탕화면에서 쉬고 돌아다닙니다.
          진화 기록 수 게이트는 0~15 글씨알, 16~30 1차, 31~54 2차, 55+ 최종이며
          모든 단계에서 성향 신호가 불충분하면 억지로 진화하지 않습니다.
          현재 A/B/C 진화 혈통이 단일 성장 체계이며, 세계 주제는 별도 외형 모티프로 누적됩니다.
          글씨알 + Route A/B/C + A1/A2/B1/B2/C1/C2는 IDLE/EAT/WALK/READ/SLEEP/TALK/기억꺼내기 production PNG를 사용합니다.
          A 혈통은 밝은 종이 얼굴, B 혈통은 검은 잉크 코어 얼굴, C 혈통은 랜턴의 따뜻한 발광 코어 얼굴을 유지합니다.
          디자인은 사용자 데이터의 versioned art override로 안전하게 교체할 수 있습니다.
          프레임이 없거나 깨졌으면 패키지 기본 PNG, 그마저 없으면 승인된 혈통 벡터 fallback을 사용합니다.
          미확정 최종 12종은 코드가 임의의 외형을 만들지 않고 가장 가까운 승인 2차 PNG를 상속합니다.
          데이터 관리에서 기록 내보내기(.bookeater-seed), 기록 심기, 기록·유전정보 초기화를 사용할 수 있습니다.
          심기/초기화 전 현재 프로필은 자동 백업되며 기기 설정과 교체 아트는 유지됩니다.
          먹이기 창의 미제출 메모는 로컬 SQLite에 자동 초안 저장되며 다음 실행/창에서 복구됩니다.
          먹이기 버튼을 누르면 원문과 책 정보가 먼저 저장되고 AI 분석은 그 뒤 백그라운드에서 진행됩니다.
          책 추천 UI는 실제 카탈로그 후보가 연결된 경우에만 작동하며, 취향 정렬은 로컬에서 수행합니다.
          배포판은 public catalog_endpoint.txt로 HTTPS 프록시 URL을 받을 수 있고, Kakao API 키는 서버에만 둡니다.
          카탈로그 서버가 설정되지 않은 배포본은 임의의 책을 만들어내지 않고 추천을 비활성화합니다.
          기록/서재/도감/기억/대사/돌보기/미니게임/첫 만남/자동실행 기능이 포함되어 있습니다.
          정식 설치 프로그램/코드 서명/자동 업데이트/카탈로그 서버 실제 배포는 아직 개발 중입니다.

          Build commit: $env:GITHUB_SHA
          "@ | Set-Content -Encoding utf8 'dist/BookEater/README_FIRST.txt'
      - name: Upload playable Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: BookEater-windows-playable
          path: dist/BookEater
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
