name: windows-e5-v311-blind
on:
  workflow_dispatch:
  push:
    branches: [sprint-03-hybrid-nlp]
    paths:
      - 'src/bookeater/nlp/hybrid_classifier_v3.py'
      - 'src/bookeater/nlp/hybrid_classifier_v31.py'
      - 'ci/e5_v311_blind_validation.py'
      - '.github/workflows/windows-e5-v311-blind.yml'
jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-local-nlp.txt
      - run: python tools/fetch_e5_model.py
      - run: python ci/e5_v311_blind_validation.py
      - shell: pwsh
        run: Get-Content -Encoding utf8 tests/e5_v311_blind_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: e5-v311-blind-report
          path: |
            tests/e5_v311_blind_report.md
            tests/e5_v311_blind_results.json
