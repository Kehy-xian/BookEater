name: windows-e5-v311-blind
on:
  workflow_dispatch:
  push:
    branches: [sprint-03-hybrid-nlp]
    paths:
      - 'src/bookeater/nlp/hybrid_classifier_v3.py'
      - 'src/bookeater/nlp/hybrid_classifier_v31.py'
      - 'ci/e5_v311_blind_validation.py'
      - '.github/workflows/windows-e5-v311-blind.yml'
jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-local-nlp.txt
      - run: python tools/fetch_e5_model.py
      - id: blind
        name: Run blind v3.1.1 validation
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force tests | Out-Null
          python ci/e5_v311_blind_validation.py 2>&1 | Tee-Object -FilePath tests/e5_v311_blind_console.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path tests/e5_v311_blind_console.txt) { Get-Content -Encoding utf8 tests/e5_v311_blind_console.txt }
          if (Test-Path tests/e5_v311_blind_report.md) { Get-Content -Encoding utf8 tests/e5_v311_blind_report.md }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e5-v311-blind-report
          if-no-files-found: warn
          path: |
            tests/e5_v311_blind_console.txt
            tests/e5_v311_blind_report.md
            tests/e5_v311_blind_results.json
      - name: Preserve validation failure
        if: steps.blind.outcome == 'failure'
        shell: pwsh
        run: exit 1
