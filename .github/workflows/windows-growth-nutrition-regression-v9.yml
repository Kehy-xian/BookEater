name: windows-growth-nutrition-regression-v9
on:
  workflow_dispatch:
  push:
    branches: [sprint-04-play-loop]
    paths:
      - '.github/workflows/windows-growth-nutrition-regression-v9.yml'
jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-local-nlp.txt
      - run: python tools/fetch_e5_model.py
      - name: Prepare regression-only copy of sealed v9 runner
        shell: pwsh
        run: |
          $src = Get-Content -Raw -Encoding utf8 ci/growth_nutrition_blind_v9.py
          $src = $src.Replace("assert NUTRITION_POLICY_VERSION == FROZEN_POLICY, (", "assert True, (")
          $src = $src.Replace("# BookEater hidden growth fresh blind v9", "# BookEater hidden growth regression v9")
          $src = $src.Replace("f'- sealed growth projector: `{FROZEN_POLICY}`'", "f'- authoring policy: `{FROZEN_POLICY}`; regression projector: `{NUTRITION_POLICY_VERSION}`'")
          Set-Content -Encoding utf8 ci/growth_nutrition_regression_v9_runtime.py $src
      - id: regression
        name: Run v9 regression with current projector
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force tests | Out-Null
          python ci/growth_nutrition_regression_v9_runtime.py 2>&1 | Tee-Object -FilePath tests/growth_nutrition_regression_v9_console.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path tests/growth_nutrition_regression_v9_console.txt) { Get-Content -Encoding utf8 tests/growth_nutrition_regression_v9_console.txt }
          if (Test-Path tests/growth_nutrition_blind_v9.md) { Get-Content -Encoding utf8 tests/growth_nutrition_blind_v9.md }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-nutrition-regression-v9
          if-no-files-found: warn
          path: |
            tests/growth_nutrition_regression_v9_console.txt
            tests/growth_nutrition_blind_v9.md
            tests/growth_nutrition_blind_v9.json
      - name: Preserve validation failure
        if: steps.regression.outcome == 'failure'
        shell: pwsh
        run: exit 1
