name: windows-e5-blind-v2
on:
  workflow_dispatch:
  push:
    branches:
      - sprint-03-hybrid-nlp
    paths:
      - 'src/bookeater/nlp/**'
      - 'ci/e5_blind_v2_validation.py'
      - 'tools/fetch_e5_model.py'
      - 'requirements-local-nlp.txt'
      - '.github/workflows/windows-e5-blind-v2.yml'

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install E5 runtime
        shell: pwsh
        run: python -m pip install -r requirements-local-nlp.txt
      - name: Fetch official multilingual-e5-small ONNX assets
        shell: pwsh
        run: python tools/fetch_e5_model.py
      - name: Run blind v2 benchmark
        shell: pwsh
        run: python ci/e5_blind_v2_validation.py
      - name: Print report
        shell: pwsh
        run: Get-Content -Encoding utf8 tests/e5_blind_v2_report.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: e5-blind-v2-report
          path: |
            tests/e5_blind_v2_report.md
            tests/e5_blind_v2_results.json
