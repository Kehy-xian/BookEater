name: growth-route-profile-v1-diagnostic
on:
  workflow_dispatch:
  push:
    branches: [sprint-04-play-loop]
    paths:
      - '.github/workflows/growth-route-profile-v1-diagnostic.yml'
      - 'src/bookeater/game/growth_route_resolver.py'
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Re-run sealed v1 profiles as diagnostic only
        run: python ci/growth_route_profile_blind_v1.py
